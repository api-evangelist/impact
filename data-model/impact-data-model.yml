core_entities:
- name: Campaign
  aliases:
  - Program
  description: A brand partnership program. The organizing entity almost everything else belongs to. The
    API path segment is Campaigns while the docs and newer fields say Programs.
- name: MediaPartner
  aliases:
  - Partner
  - Publisher
  description: An affiliate, creator or media partner enrolled in one or more campaigns.
- name: Contract
  description: The signed agreement between a brand and a partner, carrying the commission terms.
- name: Action
  description: A tracked conversion event credited to a partner and eligible for payout.
- name: ActionUpdate
  description: A change to a previously reported action - approval, reversal, amount modification.
- name: Click
  description: A tracked partner click, exported in bulk via ClickExport.
- name: Ad
  description: A creative unit a partner promotes; carries the tracking link.
- name: Deal
  description: A discount or offer partners can promote, scoped to a product, category or the whole store.
- name: PromoCode
  description: A promotional code attached to a campaign or deal.
- name: Catalog
  description: A brand product feed shared with partners; contains CatalogItems.
- name: Invoice
  description: A recipient-generated invoice covering partner payouts.
- name: Job
  description: An asynchronous export or bulk operation; the deferred-response pattern.
- name: Report
  description: A named report template that is run with parameters and exported.
