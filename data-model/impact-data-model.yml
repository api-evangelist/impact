id_conventions:
  style: PascalCase <Entity>Id integer or string
  account_scoping: Every path is scoped by {AccountSID}, which is also the HTTP Basic username.
  uri_field: Most resources return a Uri field - the relative API path back to the object - which is the
    closest thing to a hypermedia link in the API.
  prefixed_ids: false
  note: impact.com does not use type-prefixed identifiers. IDs are bare integers or opaque strings, so
    an ID alone does not tell you what it points at.
persona_partitioning:
  brand: /Advertisers/{AccountSID}/...
  partner: /Mediapartners/{AccountSID}/...
  agency: /Agencies/{AccountSID}/...
  advocate: https://app.referralsaasquatch.com/api/v1/{tenant_alias}/...
  note: The same conceptual entities (Action, Campaign, Deal, Invoice, PromoCode, Catalog) are modelled
    separately per persona with different schemas and different field sets. Advocate is a wholly separate
    model - User, Referral, Reward, RewardBalance, ShareLink - inherited from SaaSquatch.
findings:
- Campaign and Program are the same entity under two names. The path segment is /Campaigns, the Brand
  Programs API documents it as a Program, and v14 added a type field to Programs to distinguish campaign
  formats. Integrators have to hold both names.
- MediaPartner and Partner are likewise interchangeable across schemas and paths.
- There is no shared components library across the 69 documents. Address, Contact and Money-shaped objects
  are redefined per document, so the same concept has several incompatible schema definitions.
relationship_count: 185
