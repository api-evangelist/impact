api_access_by_tier:
  note: Third-party reporting describes API access as tiered - limited on Starter, enhanced on
    Essential, unlimited on Pro. impact.com does not publish this, and no rate-limit or
    entitlement document on integrations.impact.com references a plan tier. If API access is
    genuinely plan-gated, that is not discoverable from the developer portal.
provider_action: Publish a pricing page, or state plainly on the developer portal which API
  capabilities and rate limits are tied to which commercial tier.
