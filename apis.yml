- aid: impact:mcp-server
  name: Impact MCP Server
  description: Remote Model Context Protocol server for impact.com. Fifteen documented tools give an AI
    assistant account-scoped access to performance analytics, invoices, partner and program discovery,
    promo codes, tracking link creation, website and social metrics, order investigation and platform
