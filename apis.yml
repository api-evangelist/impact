aid: impact
name: Impact
description: impact.com is a partnership management platform for affiliate, creator, influencer and customer-referral
  programs. It publishes four REST API personas - Brand v14, Partner v16, Agency v3 and Advocate v13 -
  across 69 OpenAPI 3.1 documents and 245 operations, a remote OAuth 2.1 MCP server at mcp.impact.com,
  first-party agent skills, an Advocate GraphQL endpoint, webhook and postback event delivery, and an
  agent-readable developer portal that serves llms.txt, per-page markdown and a live documentation question
  interface.
type: Index
accessModel:
  pricing: freemium
  onboarding: unknown
  trial: false
