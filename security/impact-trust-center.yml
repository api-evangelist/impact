findings:
  - impact.com names SOC 1 Type II rather than SOC 2 Type II. For a SaaS platform holding
    partner payment and conversion data, SOC 2 is the control report buyers usually ask for,
    and it is not claimed.
  - PCI DSS Level 4 is the lowest merchant tier and describes impact.com's own card
    acceptance, not the security of the partner payout rails.
  - No certification artefacts are retrievable without a sales conversation.
