notes:
  - The changelog is a collapsible list on the API reference readme, not a dated feed. Entries
    inherit the release date of their version, so change granularity below the version is not
    dated.
  - Version 14 shipped 2026-06-01 with exactly one published change, while the Partner API is
    already at v16 with no separately published Partner changelog page - the version ladders
    for Brand and Partner have diverged.
