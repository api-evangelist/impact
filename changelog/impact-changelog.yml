entries:
  - version: '14'
    date: '2026-06-01'
    title: Change to Programs Endpoint
    type: addition
    breaking: false
    summary: The Programs API endpoint gained a type string field to differentiate campaign
      formats.
  - version: '13'
    date: '2025-03-01'
    title: 'New feature: Application Processing API'
    type: addition
    breaking: false
    summary: Contracts gained POST support to accept pending partner applications (optionally
      assigning a groupId) and DELETE support to decline them (optionally with reason and
      groupId).
  - version: '13'
    date: '2025-03-01'
    title: Rate limit changes for ReportExport and ClickExport
    type: policy
    breaking: false
    summary: ReportExport limited to 100 requests per day and ClickExport to 10 requests per
      day, with delayed enforcement for many brands.
  - version: '13'
    date: '2025-03-01'
    title: 'New endpoint: PromoCodeExceptionLists'
    type: addition
    breaking: false
    summary: Create, update, retrieve and delete promo code exception lists.
  - version: '13'
    date: '2025-03-01'
    title: Scoped tokens
    type: addition
    breaking: false
    summary: API credentials with per-category, per-endpoint permissions, replacing the
      read/write and read-only levels of legacy tokens.
  - version: '13'
    date: '2025-03-01'
    title: Migrate to ReportExport
    type: deprecation
    breaking: true
    summary: Legacy Reports export flow superseded by ReportExport; a migration guide is
