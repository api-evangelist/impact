          qty: requestBody.Quantity
      - text: Adjust the amount on order {order} for tracker {tracker} to {amount} with reason {reason} in account {account}.
        slots:
          account: path.AccountSID
          order: requestBody.OrderId
          tracker: requestBody.ActionTrackerId
          amount: requestBody.Amount
