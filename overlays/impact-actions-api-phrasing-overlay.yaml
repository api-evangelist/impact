- target: $.paths['/Advertisers/{AccountSID}/Actions'].get
  update:
    x-apievangelist-phrasing:
      intent: List actions recorded for a brand's program
      effect: read
      questions:
      - Which conversions has my brand program recorded as actions over the last month?
      - Can I filter the brand-side action list by state, like only approved or reversed actions?
      - How far back can a brand pull actions — is there a limit on StartDate?
      instructions:
      - text: As brand account {account}, list actions for program {campaign} between {start} and {end}.
        slots:
          account: path.AccountSID
          campaign: query.CampaignId
          start: query.StartDate
          end: query.EndDate
      - text: Show brand account {account}'s actions in program {campaign} with state {state}.
        slots:
          account: path.AccountSID
          campaign: query.CampaignId
          state: query.State
      - text: List brand-side actions for program {campaign} in account {account} that lock between {lock_start} and {lock_end}.
        slots:
          account: path.AccountSID
          campaign: query.CampaignId
          lock_start: query.LockingDateStart
          lock_end: query.LockingDateEnd
      method: generated
      generated: '2026-09-26'
