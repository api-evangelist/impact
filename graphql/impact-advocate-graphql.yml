  custom_experience: https://integrations.impact.com/integration-guides/for-brands/advocate/build-a-custom-advocate-experience-with-graphql
  rest_auth: https://integrations.impact.com/integration-guides/for-brands/advocate/advocate-api/advocate-rest-api
authentication:
  same_as: Advocate REST API
  schemes: [basicAuth (Account SID / Auth Token), APIKey (tenant API key, server-to-server),
    UserJWT (X-SaaSquatch-User-Token, client-side)]
tenancy:
  path_variable: tenant_alias
  where_to_find: impact.com Settings, Advocate Settings, General, Tenant Details
explorer:
