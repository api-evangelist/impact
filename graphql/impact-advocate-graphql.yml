      method: POST
      body: '{"query":"{__schema{queryType{name}}}"}'
      http_status: 404
      response: '{"message":"Missing or invalid tenant alias.","statusCode":404,"apiErrorCode":"TENANT_NOT_FOUND","rsCode":"RS045"}'
      fetched: '2026-08-13'
  note: Introspection requires a real tenant alias plus credentials. The schema is published
    only inside the authenticated GraphQL explorer's Documentation Explorer, so no SDL is
    retrievable anonymously. No SDL is stored here - inventing one would misrepresent the
    provider's contract.
provenance_correction:
  date: '2026-08-13'
  removed:
    - graphql/impact-schema.graphql
    - graphql/impact-graphql.md
  reason: A prior enrichment round generated an 844-line "conceptual" GraphQL SDL and a
    companion type catalogue by transliterating the impact.com REST surface into GraphQL
    types, queries and mutations. impact.com publishes no such schema. Those files asserted a
    GraphQL API shape the provider does not ship, and the apis.yml pointer typed them as
    GraphQL on the Brand API, crediting impact.com with a contract it never published. Both
    files were deleted and replaced by this probed record of the one GraphQL endpoint that
    actually exists.
provider_action: Publish the Advocate GraphQL SDL, or an introspection-enabled public schema
  endpoint, so integrators can generate types without an authenticated session.
