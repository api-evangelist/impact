name: Impact Advocate GraphQL API
description: The one real GraphQL surface impact.com publishes - the Advocate (SaaSquatch)
  GraphQL API used to build custom referral participant experiences, integrations and admin
  interfaces.
generated: '2026-08-13'
method: searched
source: https://integrations.impact.com/integration-guides/for-brands/advocate/advocate-api/graphql-api
endpoint: https://app.referralsaasquatch.com/api/v1/{tenant_alias}/graphql
ownership_note: app.referralsaasquatch.com is the Advocate product host. SaaSquatch was
  acquired by impact.com and is sold as impact.com Advocate; impact.com's own developer portal
  documents this endpoint and the published OpenAPI documents for the same host carry the
  title "SaaSquatch by impact.com API".
product: Advocate
