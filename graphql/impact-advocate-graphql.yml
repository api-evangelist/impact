  location: impact.com Settings, Advocate Settings, GraphQL
  features: [query editor, results pane, Documentation Explorer with the full schema]
  access: authenticated impact.com account only
schema:
  captured: false
  introspection_attempted: true
  introspection_result: gated
  evidence:
