name: impact.com MCP Server
description: First-party remote Model Context Protocol server for the impact.com partnership
  management platform. Exposes account-scoped tools for performance analytics, invoices,
  partner and program discovery, promo codes, tracking links, and platform help.
generated: '2026-08-13'
method: searched
source: https://integrations.impact.com/ai-solutions/mcp-quick-start
status: live
lifecycle: beta
deployment:
  mode: remote
  endpoint: https://mcp.impact.com/mcp
  auth: oauth
  verified: probed
authorization:
  protocol: OAuth 2.1
  authorization_server: https://app.impact.com
  protected_resource_metadata: https://app.impact.com/.well-known/oauth-protected-resource
  authorization_server_metadata: https://app.impact.com/.well-known/oauth-authorization-server
  authorization_endpoint: https://app.impact.com/oauth2/authorize
  token_endpoint: https://app.impact.com/oauth2/token
  revocation_endpoint: https://app.impact.com/oauth2/revoke
  pkce: S256
  scopes:
    - mcp:read
    - mcp:write
  notes:
    - A separate MCP usage token is minted per LLM client, scoped to the consenting user's
      own platform permissions.
    - A refresh token is issued so the client renews without re-consent.
    - An account administrator can disable MCP account-wide; doing so deletes every minted
      MCP usage token immediately.
    - MCP is enabled by default on every impact.com account.
