notes:
  - This is a remote hosted MCP endpoint an agent can call directly. impact.com ships no
    local stdio package, so mode is remote and install/package are intentionally absent.
  - The MCP tool surface is NOT a wrapper over the REST API. Only a handful of tools map to
    published REST operations; the analytics, discovery and guidance tools have no public REST
    equivalent. See mcp/impact-tool-crosswalk.yml.
