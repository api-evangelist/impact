tools_source: https://integrations.impact.com/ai-solutions/mcp-tools
tools:
  - name: search_help_center
    audience: [brand, partner]
    category: support
    description: Searches the impact.com Help Center for how-to and support answers, scoped to
      the caller's account type.
  - name: get_marketing_guidance
    audience: [brand, partner]
    category: guidance
    description: Answers strategy and best-practice questions about referral and partnership
      marketing; recommends Partner Experience Academy courses.
  - name: query_performance
    audience: [brand, partner]
    category: analytics
    description: Retrieves performance analytics (clicks, actions, revenue) grouped by
      dimensions such as brand, partner or date, over a date range with optional comparison
      period.
  - name: list_invoices
    audience: [brand, partner]
    category: billing
    description: Lists recipient-generated invoices, newest first, 25 per page, optionally
      filtered by created date.
  - name: get_invoice
    audience: [brand, partner]
    category: billing
    description: Retrieves one recipient-generated invoice by invoice number, including line
      items and per-program breakdown.
  - name: get_website_metrics
    audience: [brand]
    category: discovery
    description: Retrieves traffic, engagement and audience metrics for a website domain, for
      evaluating a publisher, partner or competitor site.
  - name: get_social_metrics
    audience: [brand]
    category: discovery
    description: Retrieves follower, engagement and reach metrics for a social profile, given a
      platform and handle.
  - name: investigate_order_action
    audience: [brand]
    category: tracking
    description: Looks up conversion and action-tracking records for a specific order ID within
      a campaign, to explain why an order did or did not convert.
  - name: get_brand_overdue_amount
    audience: [brand]
    category: billing
    description: Retrieves total overdue fees broken into overdue impact.com fees and overdue
      partner fees.
  - name: recommend_partners
    audience: [brand]
    category: discovery
    description: Returns a ranked list of partners recommended for the program based on
      category, country, promotional method and audience-similarity signals.
  - name: search_products
    audience: [partner]
    category: discovery
    description: Searches the impact.com marketplace for products, merchants and offers, with
      optional category, merchant and commission filters.
  - name: list_partner_promo_codes
    audience: [partner]
    category: promotions
    description: Retrieves the partner's promo codes, returning ACTIVE and PENDING codes by
      default, filterable by state or brand.
  - name: get_partner_promo_code
    audience: [partner]
    category: promotions
    description: Retrieves full details for one promo code the partner owns - code text, credit
      rule, match mode, brand, deal and schedule.
  - name: create_tracking_links
    audience: [partner]
    category: tracking
    description: Creates tracking links for one or more program destination URLs, with optional
      sub IDs and deep links.
  - name: recommend_programs
    audience: [partner]
    category: discovery
    description: Returns a ranked list of brand programs recommended for the partner based on
      category, country and audience-similarity signals.
